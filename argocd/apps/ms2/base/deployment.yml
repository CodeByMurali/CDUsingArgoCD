---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms2-deployment
  annotations:
    codefresh.io/app: ms2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms2
  template:
    metadata:
      labels:
        app: ms2
    spec:
      containers:
      - name: ms2
        imagePullPolicy: Always
        image: docker.io/kostiscodefresh/simple-env-app:1.0
        ports:
        - containerPort: 8080
