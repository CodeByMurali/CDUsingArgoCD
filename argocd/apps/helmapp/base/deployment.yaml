apiVersion: apps/v1
kind: Deployment
metadata:
  name: helmapp-deployment
  labels:
    app: helmapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helmapp
  template:
    metadata:
      labels:
        app: helmapp
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.5.4
        ports:
        - containerPort: 9898
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9898
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9898
          initialDelaySeconds: 5
          periodSeconds: 10
